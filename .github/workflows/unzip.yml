name: Unzip Project

on:
  workflow_dispatch:
  push:
    paths:
      - 'Azmir.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check zip exists
        id: check
        run: |
          if [ -f Azmir.zip ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Azmir.zip পাওয়া যায়নি, কাজ বন্ধ।"
          fi

      - name: Unzip to repo root
        if: steps.check.outputs.found == 'true'
        run: |
          mkdir -p /tmp/unz
          unzip -q -o Azmir.zip -d /tmp/unz
          # zip-এর ভেতরে যদি একটাই ফোল্ডার থাকে, সেটাকে root ধরো
          if [ "$(ls -A /tmp/unz | wc -l)" -eq 1 ] && [ -d "/tmp/unz/$(ls /tmp/unz)" ]; then
            SRC="/tmp/unz/$(ls /tmp/unz)"
          else
            SRC="/tmp/unz"
          fi
          cp -a "$SRC"/. .
          rm -f Azmir.zip

      - name: Commit and push
        if: steps.check.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip Azmir.zip" || echo "Nothing to commit"
          git push
